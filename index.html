        e.target.tagName, String(e.target.src || e.target.href || ''));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

      const entry = manifest[uuid];

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

              const { done, value } = await reader.read();
              if (done) break;

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ystem_c8e43c.SectionTitle\" as=\"h1\" dc-props=\"{{ heroTitleProps }}\" hint-size=\"100%,300px\">I help growing companies find what's blocking them.<\u002Fx-import>\n          <p style=\"margin:0;font-size:var(--fs-lead);max-width:520px;text-wrap:pretty\">Then I build a clear path forward, with you.<\u002Fp>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n            <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.Button\" variant=\"primary\" size=\"lg\" on-click=\"{{ showContact }}\" hint-size=\"150px,52px\">Let's talk<\u002Fx-import>\n            <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.Button\" variant=\"secondary\" size=\"lg\" on-click=\"{{ showPkg }}\" hint-size=\"170px,52px\">See packages<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;width:100%;max-width:560px;justify-self:end\">{{ asterisk }}<\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));align-items:stretch;gap:40px clamp(32px,6vw,96px);padding:88px 0;border-top:var(--rule-heavy) solid var(--pc-ink)\">\n        <div style=\"position:relative;min-height:320px\">\n          <img src=\"1348e403-bbd5-458b-8057-a2f5eaf6bb19\" alt=\"Illustrated portrait of Paula de Vega\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px;align-items:flex-start;justify-content:center\">\n          <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.SectionTitle\" size=\"lg\" hint-size=\"100%,44px\">About me<\u002Fx-import>\n          <p style=\"margin:0;text-wrap:pretty\">I'm a Product Manager with four years of experience, but product is only part of the picture. I've led teams across operations, support, strategy and growth in Europe and the US, mostly in fast-moving tech startups.<\u002Fp>\n          <p style=\"margin:0;text-wrap:pretty\">Before that, I spent years in the music industry and other artistic fields, managing artists, booking tours with no agent, organizing exhibitions and running events. It taught me to find original solutions when the usual ones aren't available.<\u002Fp>\n          <p style=\"margin:0;text-wrap:pretty\">That mix of strategic thinking, resilience and creativity is what led me here. Now I help growing companies whose teams and processes haven't caught up with their growth to figure out exactly what's blocking them and put a concrete plan in place to move forward.<\u002Fp>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n            <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.Button\" variant=\"secondary\" on-click=\"{{ showExp }}\" hint-size=\"140px,44px\">See my work<\u002Fx-import>\n            <a href=\"{{ linkedinUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none;display:flex\">\n              <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.Button\" variant=\"ghost\" hint-size=\"110px,44px\">LinkedIn<\u002Fx-import>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:40px;padding:72px 0;border-top:var(--rule-heavy) solid var(--pc-ink)\">\n        <sc-for list=\"{{ principles }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <img src=\"{{ astSrc }}\" alt=\"\" aria-hidden=\"true\" style=\"width:18px;height:18px;object-fit:contain;display:block;flex:none\">\n              <strong style=\"font-size:var(--fs-card-title);line-height:1.25\">{{ p.title }}<\u002Fstrong>\n            <\u002Fdiv>\n            <p style=\"margin:0;line-height:1.45;text-wrap:pretty\">{{ p.text }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n\n\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPkg }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:32px;padding:64px 0 48px\">\n        <div style=\"display:flex;flex-direction:column;gap:20px;max-width:860px\">\n          <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.SectionTitle\" as=\"h1\" hint-size=\"100%,54px\">Packages &amp; pricing<\u002Fx-import>\n          <p style=\"margin:0;font-size:var(--fs-lead);text-wrap:pretty\">I offer three predefined packages for the most common situations, as well as custom projects scoped around your needs.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"width:72px;height:72px;flex:none\">{{ smallAsterisk }}<\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"display:flex;flex-direction:column;padding:clamp(28px,4vw,48px);margin-bottom:32px;background:var(--pc-white);color:var(--pc-ink);border:1px solid var(--pc-ink);border-radius:var(--radius-card)\">\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:0 0 24px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap\">\n            <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.SectionTitle\" size=\"lg\" hint-size=\"300px,44px\">Packages<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <sc-for list=\"{{ packages }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <sc-if value=\"{{ p.heavyRule }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"height:var(--rule-heavy);background:var(--pc-ink)\"><\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ p.thinRule }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"height:0;border-top:0.5px solid var(--pc-stone-line)\"><\u002Fdiv><\u002Fsc-if>\n            <article style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:24px 48px;padding:36px 0\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <span style=\"font-size:var(--fs-body)\">{{ p.num }}<\u002Fspan>\n                <h3 style=\"margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:30px;line-height:1.05\">{{ p.name }}<\u002Fh3>\n                <em style=\"text-wrap:pretty\">{{ p.audience }}<\u002Fem>\n                <p style=\"margin:6px 0 0\"><strong>Timeline: {{ p.timeline }}<\u002Fstrong><\u002Fp>\n              <\u002Fdiv>\n              <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.BulletList\" label=\"{{ incLabel }}\" items=\"{{ p.included }}\" hint-size=\"100%,140px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.BulletList\" label=\"{{ getLabel }}\" items=\"{{ p.get }}\" hint-size=\"100%,160px\"><\u002Fx-import>\n            <\u002Farticle>\n          <\u002Fsc-for>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:28px 0 0;border-top:var(--rule-heavy) solid var(--pc-ink)\">\n            <p style=\"margin:0;font-size:var(--fs-lead)\"><strong>Package pricing:<\u002Fstrong> {{ pkgPrice }}, based on company size and requirements<\u002Fp>\n            <div style=\"margin-left:auto;display:flex\">\n            <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.Button\" variant=\"primary\" size=\"lg\" on-click=\"{{ showContact }}\" dc-props=\"{{ ctaBtnProps }}\" hint-size=\"300px,52px\">Ask about a package<\u002Fx-import>\n          <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(24px,4vw,64px);align-items:center;padding:clamp(28px,4vw,48px);margin-bottom:96px;background:var(--pc-white);color:var(--pc-ink);border:1px solid var(--pc-ink);border-radius:var(--radius-card)\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.SectionTitle\" size=\"lg\" hint-size=\"100%,44px\">Custom project<\u002Fx-import>\n          <p style=\"margin:0;font-size:var(--fs-lead);text-wrap:pretty;max-width:560px\">Every business is different. If your situation doesn't fit a package, I'll build the scope, timeline and deliverables around what you need.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:20px;align-items:flex-end;text-align:right;justify-self:end\">\n          <div style=\"display:flex;flex-direction:column;gap:2px\">\n            <span style=\"font-size:var(--fs-body)\">Starts at<\u002Fspan>\n            <strong style=\"font-family:var(--font-display);font-size:clamp(23px,2.6vw,35px);line-height:1;text-transform:uppercase\">EUR 25/hour <span style=\"font-family:var(--font-body);font-size:var(--fs-body);font-weight:700;text-transform:none\">+ VAT<\u002Fspan><\u002Fstrong>\n          <\u002Fdiv>\n          <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.Button\" variant=\"primary\" size=\"lg\" on-click=\"{{ showContact }}\" dc-props=\"{{ ctaBtnProps }}\" hint-size=\"300px,52px\">Request a custom project<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:64px;align-items:start;padding:32px 0 8px;min-height:calc(100vh - 230px);box-sizing:border-box\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.SectionTitle\" as=\"h1\" hint-size=\"100%,110px\">Let's talk<\u002Fx-import>\n          <p style=\"margin:0;font-size:var(--fs-lead);text-wrap:pretty\">Tell me what your company does and what you're trying to solve, and I'll get back to you within 48 hours.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <p style=\"margin:0;font-size:var(--fs-lead)\">Have a question first? Email me directly:<\u002Fp>\n            <a href=\"mailto:consultant@pauladevega.com\" style=\"font-weight:700;font-size:var(--fs-lead)\">consultant@pauladevega.com<\u002Fa>\n          <\u002Fdiv>\n          <div sc-camel-on-mouse-enter=\"{{ astHoverOn }}\" sc-camel-on-mouse-leave=\"{{ astHoverOff }}\" style=\"width:150px;height:150px;flex:none;margin-top:28px;cursor:pointer\">{{ smallAsterisk }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div role=\"status\" style=\"display:flex;flex-direction:column;gap:14px;padding:28px;border:1px solid var(--pc-ink);border-radius:var(--radius-card)\">\n            <strong style=\"font-size:var(--fs-card-title)\">Thanks, {{ firstName }}.<\u002Fstrong>\n            <p style=\"margin:0\">Your message has been sent. I'll get back to you within 48 hours.<\u002Fp>\n            <div style=\"display:flex\">\n              <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.Button\" variant=\"secondary\" on-click=\"{{ resetForm }}\" hint-size=\"190px,44px\">Send another message<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ submit }}\" sc-camel-no-validate=\"{{ true }}\" style=\"display:flex;flex-direction:column;gap:18px;position:relative\">\n            <div aria-hidden=\"true\" style=\"position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden\">\n              <label for=\"pdv-website\">Leave this field empty<\u002Flabel>\n              <input id=\"pdv-website\" type=\"text\" name=\"website\" sc-camel-tab-index=\"-1\" sc-camel-auto-complete=\"off\" value=\"{{ f.hp }}\" sc-camel-on-change=\"{{ on.hp }}\">\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px\">\n              <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.TextField\" label=\"Your name *\" value=\"{{ f.name }}\" on-change=\"{{ on.name }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.TextField\" label=\"Email *\" type=\"email\" value=\"{{ f.email }}\" on-change=\"{{ on.email }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px\">\n              <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.TextField\" label=\"Company (optional)\" value=\"{{ f.company }}\" on-change=\"{{ on.company }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.TextField\" label=\"Your company's field *\" placeholder=\"Fintech, education, music...\" value=\"{{ f.field }}\" on-change=\"{{ on.field }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <fieldset style=\"margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:10px\">\n              <legend style=\"padding:0 0 10px;font-weight:700\">Team size *<\u002Flegend>\n              <div ref=\"{{ sizeRef }}\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{ sizeOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.Button\" size=\"sm\" variant=\"{{ o.variant }}\" on-click=\"{{ o.pick }}\" hint-size=\"70px,34px\">{{ o.label }}<\u002Fx-import>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Ffieldset>\n            <fieldset style=\"margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:10px\">\n              <legend style=\"padding:0 0 4px;font-weight:700\">What kind of help do you need? *<\u002Flegend>\n              <em style=\"font-size:var(--fs-small)\">Pick any that apply.<\u002Fem>\n              <div ref=\"{{ helpRef }}\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{ helpOpts }}\" as=\"o\" hint-placeholder-count=\"6\">\n                  <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.Button\" size=\"sm\" variant=\"{{ o.variant }}\" on-click=\"{{ o.pick }}\" hint-size=\"140px,34px\">{{ o.label }}<\u002Fx-import>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Ffieldset>\n            <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.TextField\" label=\"Tell me more (optional)\" multiline=\"{{ true }}\" placeholder=\"Feel free to elaborate on your situation and what you'd like to achieve.\" value=\"{{ f.problem }}\" on-change=\"{{ on.problem }}\" hint-size=\"100%,140px\"><\u002Fx-import>\n            <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.TextField\" label=\"How did you hear about me? (optional)\" value=\"{{ f.source }}\" on-change=\"{{ on.source }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n            <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-top:6px\">\n              <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.Button\" type=\"submit\" variant=\"primary\" size=\"lg\" disabled=\"{{ cantSend }}\" hint-size=\"120px,52px\">{{ sendLabel }}<\u002Fx-import>\n              <em style=\"font-size:var(--fs-small)\">{{ formHint }}<\u002Fem>\n            <\u002Fdiv>\n            <sc-if value=\"{{ error }}\" hint-placeholder-val=\"{{ false }}\">\n              <p role=\"alert\" style=\"margin:0;padding:14px 18px;border:1.5px solid var(--pc-ink);border-radius:var(--radius-sm)\">Sorry, your message couldn't be sent. Please try again, or email me directly at <a href=\"mailto:consultant@pauladevega.com\" style=\"font-weight:700\">consultant@pauladevega.com<\u002Fa>.<\u002Fp>\n            <\u002Fsc-if>\n            <div style=\"display:flex;flex-direction:column;gap:12px;max-width:620px\">\n              <label style=\"display:flex;align-items:center;gap:10px;font-size:var(--fs-small);cursor:pointer\">\n                <input type=\"checkbox\" required=\"{{ true }}\" checked=\"{{ f.consent }}\" sc-camel-on-change=\"{{ on.consent }}\" style=\"width:20px;height:20px;margin:0;accent-color:var(--pc-green);flex:none\">\n                <span>I've read the <a href=\"#privacy\" sc-camel-on-click=\"{{ goPrivacy }}\">privacy policy<\u002Fa> *<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fform>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isExp }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:32px;padding:64px 0 48px\">\n        <div style=\"display:flex;flex-direction:column;gap:20px;max-width:860px\">\n          <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.SectionTitle\" as=\"h1\" hint-size=\"100%,54px\">Work<\u002Fx-import>\n          <p style=\"margin:0;font-size:var(--fs-lead);text-wrap:pretty\">A selection of projects where I helped teams get organized, find clarity and move forward.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"width:72px;height:72px;flex:none\">{{ smallAsterisk }}<\u002Fdiv>\n      <\u002Fsection>\n\n\n      <div style=\"display:flex;flex-direction:column;gap:32px;padding:0 0 96px\">\n        <sc-for list=\"{{ experience }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <article style=\"display:flex;flex-direction:column;gap:28px;background:var(--pc-white);color:var(--pc-ink);border:1px solid var(--pc-ink);border-radius:var(--radius-card);padding:clamp(28px,4vw,48px)\">\n            <div style=\"display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:var(--rule-heavy) solid var(--pc-ink)\">\n              <em style=\"font-size:var(--fs-body)\">From {{ e.from }}<\u002Fem>\n              <h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(26px,2.6vw,34px);line-height:1.05;text-wrap:balance\">{{ e.title }}<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:28px 48px;align-items:flex-start\">\n              <dl style=\"margin:0;display:flex;flex-direction:column;gap:16px;flex:1 1 200px\">\n                <div style=\"display:flex;flex-direction:column;gap:2px\">\n                  <dt style=\"font-size:var(--fs-small)\">Project duration<\u002Fdt>\n                  <dd style=\"margin:0;font-weight:700;font-size:var(--fs-card-title)\">{{ e.duration }}<\u002Fdd>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:2px;padding-top:16px;border-top:1px solid var(--pc-ink)\">\n                  <dt style=\"font-size:var(--fs-small)\">Industry<\u002Fdt>\n                  <dd style=\"margin:0;font-weight:700;font-size:var(--fs-card-title)\">{{ e.industry }}<\u002Fdd>\n                <\u002Fdiv>\n              <\u002Fdl>\n              <div style=\"display:flex;flex-direction:column;gap:24px;flex:3 1 420px;min-width:0;max-width:880px\">\n                <sc-for list=\"{{ e.body }}\" as=\"b\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;flex-direction:column;gap:10px\">\n                    <strong>{{ b.label }}<\u002Fstrong>\n                    <sc-for list=\"{{ b.paras }}\" as=\"para\" hint-placeholder-count=\"1\">\n                      <p style=\"margin:0;text-wrap:pretty\">{{ para }}<\u002Fp>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n        <em style=\"font-size:var(--fs-body);padding-top:8px\">References available on request.<\u002Fem>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isLegal }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:32px;padding:64px 0 40px\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;max-width:860px\">\n          <x-import component-from-global-scope=\"PaulaConsultingDesignSystem_c8e43c.SectionTitle\" as=\"h1\" hint-size=\"100%,54px\">Legal &amp; privacy<\u002Fx-import>\n          <em style=\"font-size:var(--fs-body)\">Last updated: 12 October 2026<\u002Fem>\n        <\u002Fdiv>\n        <div style=\"width:72px;height:72px;flex:none\">{{ smallAsterisk }}<\u002Fdiv>\n      <\u002Fsection>\n      <div style=\"display:flex;flex-direction:column;gap:14px;max-width:820px;padding:0 0 96px\">\n        <h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:24px;line-height:1.1;scroll-margin-top:24px\">Legal notice<\u002Fh2>\n        <p style=\"margin:0;text-wrap:pretty\">This website belongs to Paula de Vega, an independent business consultant based in Madrid, Spain. You can reach me at <a href=\"mailto:consultant@pauladevega.com\">consultant@pauladevega.com<\u002Fa>. Don't reproduce texts, illustrations and brand elements on this site without permission. The information here is for general purposes only, and I'm not responsible for external websites linked from it. This notice is governed by Spanish law, and any dispute will be handled by the courts of Madrid.<\u002Fp>\n        <div style=\"height:36px\"><\u002Fdiv>\n        <h2 id=\"privacy\" style=\"margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:24px;line-height:1.1;scroll-margin-top:24px\">Privacy<\u002Fh2>\n        <p style=\"margin:0;text-wrap:pretty\">When you send the contact form, I use your details only to reply to your enquiry, based on the consent you give by ticking the checkbox. I don't add you to any mailing list and I never sell or share your data. Your message reaches me through [form service], [hosting provider] and [email provider]. I keep it only while we're in conversation, and if we don't end up working together I delete it within 12 months at the latest. This website doesn't use cookies or tracking.<\u002Fp>\n        <p style=\"margin:0;text-wrap:pretty\">You can ask me to access, correct or delete your data, or withdraw your consent, at any time by emailing <a href=\"mailto:consultant@pauladevega.com\">consultant@pauladevega.com<\u002Fa>. If you think your data hasn't been handled properly, you can complain to the Spanish Data Protection Agency (AEPD) at <a href=\"https://www.aepd.es\" target=\"_blank\" rel=\"noopener noreferrer\">www.aepd.es<\u002Fa>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <footer style=\"display:flex;justify-content:flex-end;padding:24px 0 28px;font-size:var(--fs-caption)\">\n      <p style=\"margin:0;display:flex;flex-wrap:wrap;gap:8px\">\n        <span>© 2026 Paula de Vega<\u002Fspan><span aria-hidden=\"true\">·<\u002Fspan>\n        <a href=\"#legal\" sc-camel-on-click=\"{{ goLegal }}\" style=\"color:var(--pc-ink)\">Legal &amp; privacy<\u002Fa>\n      <\u002Fp>\n    <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;packageFooter&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Price on request&quot;,&quot;Let's talk pricing&quot;,&quot;Quoted per project&quot;],&quot;default&quot;:&quot;Price on request&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;linkedinUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://www.linkedin.com/in/pauladvg&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links &amp; form&quot;},&quot;formEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links &amp; form&quot;},&quot;formAccessKey&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links &amp; form&quot;}}\">\nclass Component extends DCLogic {\n  static AST = (window.__resources && window.__resources.astGreen) || 'assets/asterisk-green.png';\n  static ROUTES = { work: '', exp: 'work', pkg: 'packages', contact: 'contact', legal: 'legal' };\n  static emptyForm() { return { name: '', email: '', company: '', field: '', problem: '', source: '', size: '', help: [], consent: false, hp: '' }; }\n  tabFromHash() {\n    const hsh = (window.location.hash || '').replace(/^#/, '');\n    if (hsh === 'privacy') return 'legal';\n    const hit = Object.entries(Component.ROUTES).find(([, v]) => v && v === hsh);\n    return hit ? hit[0] : 'work';\n  }\n  state = { tab: this.tabFromHash(), sent: false, sending: false, error: false, f: Component.emptyForm() };\n  go(tab) {\n    const slug = Component.ROUTES[tab];\n    const url = slug ? '#' + slug : window.location.pathname + window.location.search;\n    if (tab !== this.state.tab) { try { window.history.pushState({ tab }, '', url); } catch (e) {} }\n    this.setState({ tab }); window.scrollTo(0, 0);\n  }\n  scrollToPrivacy() {\n    let tries = 0;\n    const tryScroll = () => {\n      const el = document.getElementById('privacy');\n      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 24, behavior: 'smooth' });\n      else if (tries++ < 20) setTimeout(tryScroll, 50);\n    };\n    setTimeout(tryScroll, 30);\n  }\n  goPrivacy = e => {\n    if (e && e.preventDefault) e.preventDefault();\n    if ((window.location.hash || '') !== '#privacy') { try { window.history.pushState({ tab: 'legal' }, '', '#privacy'); } catch (err) {} }\n    this.setState({ tab: 'legal' });\n    this.scrollToPrivacy();\n  };\n  link(tab) { return e => { if (e && e.preventDefault) e.preventDefault(); this.go(tab); }; }\n  onRoute = () => {\n    const tab = this.tabFromHash();\n    const toPrivacy = window.location.hash === '#privacy';\n    if (tab !== this.state.tab) { this.setState({ tab }); if (!toPrivacy) window.scrollTo(0, 0); }\n    if (toPrivacy) this.scrollToPrivacy();\n  };\n  optEls = {};\n  sizeRef = el => { this.optEls.size = el; this.syncAria(); };\n  helpRef = el => { this.optEls.help = el; this.syncAria(); };\n  syncAria() {\n    const f = this.state.f;\n    [['size', ['1-10', '11-50', '51-200', '200+'], v => f.size === v], ['help', Component.HELP, v => f.help.includes(v)]].forEach(([k, list, isOn]) => {\n      const el = this.optEls[k]; if (!el) return;\n      el.querySelectorAll('button').forEach((b, i) => { if (list[i] != null) b.setAttribute('aria-pressed', isOn(list[i]) ? 'true' : 'false'); });\n    });\n  }\n  static HELP = ['Business diagnosis', 'Process and team audit', 'Strategy roadmap', 'Operations setup', 'Brand story and voice', 'Custom project', 'Not sure yet'];\n  componentDidUpdate() { this.syncAria(); }\n  astRef = React.createRef();\n  componentDidMount() {\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    let angle = 0, lastY = window.scrollY, boost = 0, mx = 0, my = 0, cx = 0, cy = 0;\n    this._onMove = e => { mx = (e.clientX / window.innerWidth - 0.5); my = (e.clientY / window.innerHeight - 0.5); };\n    window.addEventListener('pointermove', this._onMove);\n    window.addEventListener('popstate', this.onRoute);\n    window.addEventListener('hashchange', this.onRoute);\n    if (window.location.hash === '#privacy') this.scrollToPrivacy();\n    let frame = 0;\n    const tick = () => {\n      const y = window.scrollY; boost += (y - lastY) * 0.25; lastY = y;\n      boost *= 0.9;\n      this._spin = (this._spin || 0) + ((this._hover ? 6 : 0) - (this._spin || 0)) * 0.08;\n      angle += (reduce ? 0 : 0.12) + boost * 0.1 + this._spin;\n      cx += (mx - cx) * 0.05; cy += (my - cy) * 0.05;\n      const el = this.astRef.current;\n      if (el) el.style.transform = `translate(${cx * 24}px, ${cy * 24}px) rotate(${angle}deg)`;\n      this.smallEls.forEach(s => { s.style.transform = `translate(${cx * 6}px, ${cy * 6}px) rotate(${angle * 1.4}deg)`; });\n      if (++frame % 30 === 0) this.syncAria();\n      this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n  componentWillUnmount() { cancelAnimationFrame(this._raf); window.removeEventListener('pointermove', this._onMove); window.removeEventListener('popstate', this.onRoute); window.removeEventListener('hashchange', this.onRoute); }\n  asteriskEl = React.createElement('img', { ref: this.astRef, src: Component.AST, alt: '', 'aria-hidden': true,\n    style: { width: '100%', height: '100%', objectFit: 'contain', display: 'block', willChange: 'transform' } });\n  smallEls = new Set();\n  smallRef = el => { if (el) { this.smallEls.add(el); } else { this.smallEls.forEach(s => { if (!s.isConnected) this.smallEls.delete(s); }); } };\n  smallAsteriskEl = React.createElement('img', { ref: this.smallRef, src: Component.AST, alt: '', 'aria-hidden': true,\n    style: { width: '100%', height: '100%', objectFit: 'contain', display: 'block', willChange: 'transform' } });\n  set(k, v) { this.setState(s => ({ f: { ...s.f, [k]: v } })); }\n  opts(list, key, multi) {\n    const cur = this.state.f[key];\n    return list.map(label => {\n      const on = multi ? cur.includes(label) : cur === label;\n      return { label, variant: on ? 'primary' : 'secondary',\n        pick: () => this.set(key, multi ? (on ? cur.filter(x => x !== label) : [...cur, label]) : (on ? '' : label)) };\n    });\n  }\n  submit = async (e) => {\n    e.preventDefault();\n    if (this.state.sending || !this.isReady()) return;\n    const f = this.state.f;\n    if (f.hp) { this.setState({ sent: true, error: false }); return; }\n    this.setState({ sending: true, error: false });\n    try {\n      const endpoint = this.props.formEndpoint;\n      if (!endpoint || !/^https?:\\/\\//.test(endpoint)) throw new Error('No form endpoint set');\n      const payload = { name: f.name, email: f.email, company: f.company, field: f.field, team_size: f.size,\n        help_needed: f.help.join(', '), message: f.problem, heard_about: f.source, privacy_consent: 'yes',\n        _subject: 'New enquiry - ' + (f.company || f.name), subject: 'New enquiry - ' + (f.company || f.name), from_name: f.name };\n      if (this.props.formAccessKey) payload.access_key = this.props.formAccessKey;\n      const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload) });\n      const data = await res.json().catch(() => ({}));\n      if (!res.ok || data.success === false || data.ok === false) throw new Error('Send failed');\n      this.setState({ sending: false, sent: true });\n    } catch (err) {\n      this.setState({ sending: false, error: true });\n    }\n  };\n  isReady() { const f = this.state.f; return !!(f.name.trim() && /\\S+@\\S+\\.\\S+/.test(f.email) && f.field.trim() && f.size && f.help.length && f.consent); }\n  renderVals() {\n    const { tab, f, sent, sending, error } = this.state;\n    const price = this.props.packageFooter ?? 'Price on request';\n    const v = t => tab === t ? 'secondary' : 'ghost';\n    const ready = this.isReady();\n    const on = {};\n    ['name', 'email', 'company', 'field', 'problem', 'source', 'hp'].forEach(k => { on[k] = e => this.set(k, e.target.value); });\n    on.consent = e => this.set('consent', e.target.checked);\n    return {\n      isWork: tab === 'work', isExp: tab === 'exp', isPkg: tab === 'pkg', isContact: tab === 'contact', isLegal: tab === 'legal',\n      sizeRef: this.sizeRef, helpRef: this.helpRef, error, sendLabel: sending ? 'Sending...' : 'Send',\n      goLegal: this.link('legal'), goPrivacy: this.goPrivacy,\n      workVariant: v('work'), expVariant: v('exp'), pkgVariant: v('pkg'),\n      asterisk: this.asteriskEl,\n      astSrc: Component.AST,\n      smallAsterisk: this.smallAsteriskEl,\n      astHoverOn: () => { this._hover = true; },\n      astHoverOff: () => { this._hover = false; },\n      ctaBtnProps: { style: { minWidth: 300, justifyContent: 'center' } },\n      linkedinUrl: this.props.linkedinUrl || 'https://www.linkedin.com/in/pauladvg',\n      heroTitleProps: { style: { fontSize: 'clamp(44px,6.4vw,96px)', lineHeight: 0.95 } },\n      ctaTitleProps: { style: { fontSize: 'clamp(34px,4.6vw,64px)', maxWidth: 980 } },\n      goHome: this.link('work'),\n      principles: [\n        { title: 'One client at a time', text: \"A deliberate choice. When I'm working with you, I'm fully focused on your business.\" },\n        { title: 'The real problem first', text: \"The visible problem is rarely the root cause. Before recommending anything, I interview your team at every level, review your processes, data and finances, and map exactly where things break down.\" },\n        { title: 'No fixed playbook', text: \"I'll ask uncomfortable questions and push back on assumptions. Then we figure out a custom solution for your situation. Every case is different.\" },\n      ],\n      showWork: () => this.go('work'), showExp: () => this.go('exp'), showPkg: () => this.go('pkg'), showContact: () => this.go('contact'),\n      f, on, submit: this.submit, sent, notSent: !sent, cantSend: !ready || sending,\n      firstName: f.name.trim().split(' ')[0],\n      formHint: sending ? 'Sending your message...' : ready ? '' : 'Fields marked * are required.',\n      resetForm: () => this.setState({ sent: false, error: false, f: Component.emptyForm() }),\n      sizeOpts: this.opts(['1-10', '11-50', '51-200', '200+'], 'size'),\n      helpOpts: this.opts(Component.HELP, 'help', true),\n      pkgPrice: price,\n      incLabel: React.createElement('strong', null, \"What's included:\"),\n      getLabel: React.createElement('strong', null, 'What you get:'),\n      packages: [\n        { heavyRule: true, num: 'Package 1', name: 'Business diagnosis', audience: \"For companies that need clarity on what's holding them back\", timeline: '2-3 weeks',\n          included: ['Current state assessment (operations, product, processes)', 'Root cause analysis', 'Competitive benchmarking', 'Quick-win identification'],\n          get: ['Diagnostic presentation', 'Priority action roadmap (30-90 days)', 'One 90-minute strategy session'] },\n        { thinRule: true, num: 'Package 2', name: 'Full assessment', audience: 'For companies ready to make changes based on an execution plan', timeline: '5-7 weeks',\n          included: ['Everything in Package 1', 'Process mapping and optimization', 'Team structure and workflow audit', 'Project management system setup'],\n          get: ['Detailed diagnostic presentation', '4-month priority roadmap', 'Two 90-minute strategy sessions', '2 weeks of post-delivery support via email/calls (up to 2 hours/week)'] },\n        { thinRule: true, num: 'Package 3', name: 'Complete strategy', audience: 'For companies committed to significant change who need clear strategy', timeline: '7-9 weeks',\n          included: ['Everything in Packages 1 & 2', 'Cross-functional tech audit', 'Market growth assessment'],\n          get: ['Complete diagnostic presentation', 'Complete operations and project management guide', 'KPI dashboard template', '6-month strategic roadmap', '4 weeks of post-delivery support via email/calls (up to 4 hours/week)'] },\n      ],\n      experience: [\n        { from: 'August 2025', title: 'Consultant for a SAP agency', duration: '3-6 months', industry: 'Education',\n          body: [{ label: 'The client:', paras: [\"A SAP consultancy agency that wanted to offer a more practical and accessible approach to SAP education for students and professionals worldwide.\"] },\n                 { label: 'What I did:', paras: [\"I helped this agency build a hybrid training school combining online modules, in-person bootcamps, and internship opportunities for people starting in SAP.\",\n                   \"I analyzed the company, the competitors, the goals and the project, and set up the roadmap. I developed guidelines across legal, operational, educational and technical areas, drafted contracts for trainers, mapped out course structures across key SAP modules, and built the onboarding process for instructors. I listed everything they were missing, such as venues for in-person sessions, schedules, course pacing and live support, and helped them fill those gaps, setting the foundation for this to scale into a real product.\"] }] },\n        { from: 'January 2023', title: 'Consultant for an IT platform', duration: '6+ months', industry: 'Fintech & Logistics',\n          body: [{ label: 'The client:', paras: [\"Equipped, an outsourced IT team for businesses without one, handling everything from buying and leasing devices to software, onboarding, compliance and ongoing support.\"] },\n                 { label: 'What I did:', paras: [\"I consulted for Equipped on operations, product and customer success.\",\n                   \"I analyzed why these layers were causing friction, organized and documented the core logistics processes, and implemented an internal tracking system to monitor the full lifecycle of every order. I worked closely with the founding team to define workflows, define the support role, and coordinate across hardware vendors, internal teams and external partners like Apple Consultants. I also improved key parts of the billing process, so each customer, whether on a recurring plan or a one-time setup, was invoiced accurately and on schedule.\"] }] },\n        { from: 'March 2018', title: 'Consultant for artists', duration: '3-6 months', industry: 'Music & Arts',\n          body: [{ label: 'The client:', paras: [\"Independent bands and artists looking for guidance on growing their careers, whether that meant making their work profitable, getting honest feedback, building a plan or defining their brand voice.\"] },\n                 { label: 'What I did:', paras: [\"I gave strategic feedback on albums, finances, projects and career growth. The work covered a wide range of challenges, from optimizing touring budgets and getting professional production on a tight budget to finding the right audiences, venues and spaces for their work. I also helped artists redefine their visual identity for a new era while staying true to their core voice, and built release and promotion plans to get their work in front of the right people.\"] }] },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
